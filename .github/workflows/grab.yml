# Hunts for an Always Free A1.Flex instance every 8 minutes, around the clock,
# until one lands. No machine of your own needed.
#
# A job can only last 6 hours, so each run makes up to 40 attempts (~5h20m)
# and then starts the next run itself. The chain stops when an instance lands
# or when retrying can't help (bad OCID, used-up quota), and tells you either
# way. The schedule below only restarts the chain if it ever breaks; once an
# instance exists, those runs see it and exit in seconds.
#
# Start it: Actions -> "Grab OCI instance" -> Run workflow.
# Stop it:  Actions -> "Grab OCI instance" -> "..." -> Disable workflow.
#           (Cancelling a run is not enough: the next run starts by itself.)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   OCI_KEY           contents of your API private key .pem
#   OCI_USER_OCID     user=...        from your ~/.oci/config
#   OCI_TENANCY_OCID  tenancy=...     from your ~/.oci/config
#   OCI_FINGERPRINT   fingerprint=... from your ~/.oci/config
#   OCI_REGION        e.g. us-chicago-1
#   OCI_SUBNET_ID     a PUBLIC subnet OCID
#   OCI_IMAGE_ID      an aarch64 image OCID
#   SSH_PUBLIC_KEY    contents of oci_arm.pub (the .pub, not the private key)
#   DISCORD_WEBHOOK   optional, Discord notifications
#   NTFY_URL          optional, phone push via the ntfy app (https://ntfy.sh/<topic>)

name: Grab OCI instance

on:
  # Backstop only: restarts the chain if a run was lost. GitHub disables
  # scheduled triggers after 60 days with no repo activity; the chain itself
  # keeps going regardless.
  schedule:
    - cron: '17 */6 * * *'

  workflow_dispatch:
    inputs:
      max_tries:
        description: "Attempts per run before handing over to the next run. MAX 42 (8 min each, 350 min job cap)."
        required: true
        default: "40"
      ocpus:
        description: "OCPUs (1 lands far more often than 4)"
        required: true
        default: "1"
      memory_gb:
        description: "Memory in GB (6 pairs with 1 OCPU)"
        required: true
        default: "6"
      display_name:
        description: "Instance name"
        required: true
        default: "docker-host"

permissions:
  contents: read
  actions: write      # lets a run start the next one

concurrency:
  # Only one run at a time, so the backstop schedule queues behind the chain
  # instead of doubling the request rate.
  group: oci-grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    # 6h is the GitHub-hosted ceiling. 30 tries lands around 5h, so this stops
    # the job before GitHub kills it mid-attempt.
    timeout-minutes: 350

    steps:
      - name: Check max_tries can finish inside the job timeout
        env:
          MAX_TRIES: ${{ inputs.max_tries || '40' }}
        run: |
          set -euo pipefail
          # One attempt starts every 8 minutes. The job is capped at 350 min,
          # and a cancelled job never reaches the script's exit path.
          case "$MAX_TRIES" in ''|*[!0-9]*) echo "::error::max_tries must be a whole number"; exit 1;; esac
          if [ "$MAX_TRIES" -gt 42 ]; then
            echo "::error::max_tries=$MAX_TRIES would need about $(( MAX_TRIES * 8 )) min; the limit is 42."
            exit 1
          fi
          echo "max_tries=$MAX_TRIES -> about $(( MAX_TRIES * 8 )) min, inside the 350 min cap."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the OCI CLI
        run: pip install --quiet oci-cli

      - name: Write OCI credentials
        env:
          OCI_KEY: ${{ secrets.OCI_KEY }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for v in OCI_KEY OCI_USER_OCID OCI_TENANCY_OCID OCI_FINGERPRINT \
                   OCI_REGION OCI_SUBNET_ID OCI_IMAGE_ID SSH_PUBLIC_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::repository secret $v is not set"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          mkdir -p ~/.oci
          # Secrets copied from Windows carry CRLF, and a value saved with its own
          # trailing newline gains a second one from printf -- which left a blank
          # line in id.pub that the API rejected as a malformed key entry.
          # Strip CR, then drop blank lines so each file ends with exactly one \n.
          printf '%s\n' "$OCI_KEY"        | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.oci/key.pem
          printf '%s\n' "$SSH_PUBLIC_KEY" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.oci/id.pub
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config

          # Fail loudly on a pasted-wrong secret rather than 5h of 401s.
          grep -q 'BEGIN' ~/.oci/key.pem \
            || { echo "::error::OCI_KEY is not a PEM private key"; exit 1; }
          grep -q '^ssh-' ~/.oci/id.pub \
            || { echo "::error::SSH_PUBLIC_KEY is not an SSH public key (use the .pub)"; exit 1; }
          # a multi-line value here means the private key was pasted by mistake
          [ "$(wc -l < ~/.oci/id.pub)" -eq 1 ] \
            || { echo "::error::SSH_PUBLIC_KEY has $(wc -l < ~/.oci/id.pub) lines; a public key is one line"; exit 1; }

      - name: Verify credentials before spending hours
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          set -euo pipefail
          echo "availability domains visible to these credentials:"
          oci iam availability-domain list \
            --compartment-id "$OCI_TENANCY_OCID" --query 'data[].name' --raw-output

      - name: Hunt
        id: hunt
        env:
          COMPARTMENT_ID: ${{ secrets.OCI_TENANCY_OCID }}
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          MAX_TRIES: ${{ inputs.max_tries || '40' }}
          OCPUS: ${{ inputs.ocpus || '1' }}
          MEM_GB: ${{ inputs.memory_gb || '6' }}
          DISPLAY_NAME: ${{ inputs.display_name || 'docker-host' }}
          SSH_KEY: /home/runner/.oci/id.pub
          # 130 attempts/day. Measured overhead is ~27s per attempt on top of
          # the sleep (480 produced 507), so 638 average gives a 665s cycle:
          # 86400/665 = 130. Jittered so attempts do not land on a fixed grid.
          MIN_SLEEP: "620"
          MAX_SLEEP: "655"
          STOP_IF_SHAPE_EXISTS: "1"
          NOTIFY_GIVEUP: "0"     # a run running out of tries is routine here
        run: |
          chmod +x ./oci-grab.sh
          rc=0; ./oci-grab.sh run || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case $rc in
            0) echo "Instance exists. The chain stops here." ;;
            2) echo "::error::Stopped: retrying will not fix this (see above)."; exit 2 ;;
            *) echo "No instance yet (exit $rc). The next run picks up." ;;
          esac

      # Hand over to a fresh run, unless an instance landed or the config is
      # broken. Also covers a run killed by the job cap or cancelled by GitHub.
      # Give-ups are silent by design, so without this a dead webhook looks
      # exactly like a hunt that has not landed yet. At ~3.25 runs/day every
      # third run is roughly daily.
      - name: Daily heartbeat
        if: always() && steps.hunt.outputs.rc != '0'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          [ -n "${DISCORD_WEBHOOK:-}" ] || { echo "no webhook configured"; exit 0; }
          [ $(( RUN_NUMBER % 3 )) -eq 0 ] || { echo "not a heartbeat run"; exit 0; }
          curl -fsS -m 20 -H 'Content-Type: application/json' \
            -d '{"content":":hourglass_flowing_sand: Still hunting. No instance yet, chain is alive. You will get a message the moment one lands."}' \
            "$DISCORD_WEBHOOK" >/dev/null \
            && echo "heartbeat sent" \
            || echo "::warning::heartbeat failed -- the webhook may be dead, so you would miss the landing message"

      - name: Start the next run
        if: always() && (steps.hunt.outcome == 'cancelled' || (steps.hunt.outputs.rc != '' && steps.hunt.outputs.rc != '0' && steps.hunt.outputs.rc != '2'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run grab.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f max_tries="${{ inputs.max_tries || '40' }}" \
            -f ocpus="${{ inputs.ocpus || '1' }}" \
            -f memory_gb="${{ inputs.memory_gb || '6' }}" \
            -f display_name="${{ inputs.display_name || 'docker-host' }}"
          echo "Next run queued."
