# One-shot, bounded hunt for an Always Free A1.Flex instance.
#
# Deliberately NOT on a schedule. A cron that polls indefinitely is the usage
# pattern that has got Oracle accounts flagged and their service limits zeroed
# (mohankumarpaluru/oracle-freetier-instance-creation#75). You start this by
# hand, it makes max_tries attempts, tells Discord what happened, and stops.
#
# Run it: Actions -> "Grab OCI instance" -> Run workflow.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   OCI_KEY           contents of your API private key .pem
#   OCI_USER_OCID     user=...        from your ~/.oci/config
#   OCI_TENANCY_OCID  tenancy=...     from your ~/.oci/config
#   OCI_FINGERPRINT   fingerprint=... from your ~/.oci/config
#   OCI_REGION        e.g. us-chicago-1
#   OCI_SUBNET_ID     a PUBLIC subnet OCID
#   OCI_IMAGE_ID      an aarch64 image OCID
#   SSH_PUBLIC_KEY    contents of oci_arm.pub (the .pub, not the private key)
#   DISCORD_WEBHOOK   optional; omit for no notifications

name: Grab OCI instance

on:
  # Runs until an instance lands, then every later run exits in seconds because
  # the script checks first whether one already exists.
  #
  # Cadence vs. the account in oracle-freetier-instance-creation#75 that had its
  # service limits zeroed (every 10 min for two months = ~144 attempts/day):
  #   '0 */12 * * *'  ->  70 attempts/day   (half that rate)   <- default
  #   '0 */8  * * *'  -> 105 attempts/day   (three quarters)
  #   '0 */6  * * *'  -> 140 attempts/day   (the same rate)
  # Change the line below to move between them.
  #
  # GitHub disables scheduled workflows after 60 days with no repo activity.
  schedule:
    - cron: '0 */12 * * *'

  workflow_dispatch:
    inputs:
      max_tries:
        description: "Attempts before giving up. MAX 35 -- each takes ~9 min and the job is capped at 350."
        required: true
        default: "30"
      ocpus:
        description: "OCPUs (1 lands far more often than 4)"
        required: true
        default: "1"
      memory_gb:
        description: "Memory in GB (6 pairs with 1 OCPU)"
        required: true
        default: "6"
      display_name:
        description: "Instance name"
        required: true
        default: "docker-host"

permissions:
  contents: read

concurrency:
  # A run lasts ~5.2h, so a delayed schedule could otherwise start a second one
  # on top of the first and double the request rate.
  group: oci-grab
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    # 6h is the GitHub-hosted ceiling. 30 tries lands around 5h, so this stops
    # the job before GitHub kills it mid-attempt.
    timeout-minutes: 350

    steps:
      - name: Check max_tries can finish inside the job timeout
        env:
          MAX_TRIES: ${{ inputs.max_tries || '30' }}
        run: |
          set -euo pipefail
          # Measured: ~8.9 min per attempt (launch call + sleep). The job is
          # capped at 350 min, so anything past ~39 is killed mid-run -- and a
          # cancelled job never reaches the script's exit path, so no Discord.
          case "$MAX_TRIES" in ''|*[!0-9]*) echo "::error::max_tries must be a whole number"; exit 1;; esac
          if [ "$MAX_TRIES" -gt 35 ]; then
            echo "::error::max_tries=$MAX_TRIES would need about $(( MAX_TRIES * 89 / 10 )) min."
            echo "::error::The limit is 35, leaving headroom under the 350-minute job cap because capacity calls sometimes run long."
            echo "::error::Use 35 or fewer and start the workflow again for more attempts."
            exit 1
          fi
          echo "max_tries=$MAX_TRIES -> about $(( MAX_TRIES * 89 / 10 )) min, inside the 350 min cap."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the OCI CLI
        run: pip install --quiet oci-cli

      - name: Write OCI credentials
        env:
          OCI_KEY: ${{ secrets.OCI_KEY }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for v in OCI_KEY OCI_USER_OCID OCI_TENANCY_OCID OCI_FINGERPRINT \
                   OCI_REGION OCI_SUBNET_ID OCI_IMAGE_ID SSH_PUBLIC_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::repository secret $v is not set"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          mkdir -p ~/.oci
          # Secrets copied from Windows carry CRLF, and a value saved with its own
          # trailing newline gains a second one from printf -- which left a blank
          # line in id.pub that the API rejected as a malformed key entry.
          # Strip CR, then drop blank lines so each file ends with exactly one \n.
          printf '%s\n' "$OCI_KEY"        | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.oci/key.pem
          printf '%s\n' "$SSH_PUBLIC_KEY" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.oci/id.pub
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config

          # Fail loudly on a pasted-wrong secret rather than 5h of 401s.
          grep -q 'BEGIN' ~/.oci/key.pem \
            || { echo "::error::OCI_KEY is not a PEM private key"; exit 1; }
          grep -q '^ssh-' ~/.oci/id.pub \
            || { echo "::error::SSH_PUBLIC_KEY is not an SSH public key (use the .pub)"; exit 1; }
          # a multi-line value here means the private key was pasted by mistake
          [ "$(wc -l < ~/.oci/id.pub)" -eq 1 ] \
            || { echo "::error::SSH_PUBLIC_KEY has $(wc -l < ~/.oci/id.pub) lines; a public key is one line"; exit 1; }

      - name: Verify credentials before spending hours
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          set -euo pipefail
          echo "availability domains visible to these credentials:"
          oci iam availability-domain list \
            --compartment-id "$OCI_TENANCY_OCID" --query 'data[].name' --raw-output

      - name: Hunt
        id: hunt
        env:
          COMPARTMENT_ID: ${{ secrets.OCI_TENANCY_OCID }}
          SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAX_TRIES: ${{ inputs.max_tries || '30' }}
          OCPUS: ${{ inputs.ocpus || '1' }}
          MEM_GB: ${{ inputs.memory_gb || '6' }}
          DISPLAY_NAME: ${{ inputs.display_name || 'docker-host' }}
          SSH_KEY: /home/runner/.oci/id.pub
        run: |
          chmod +x ./oci-grab.sh
          ./oci-grab.sh run

      # A timed-out or cancelled job is killed mid-sleep, so the script never
      # runs its own notification. Without this the run just goes quiet.
      - name: Report a cancelled or timed-out run
        if: always() && steps.hunt.outcome == 'cancelled'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -n "${DISCORD_WEBHOOK:-}" ] || exit 0
          curl -fsS -m 20 -H 'Content-Type: application/json' \
            -d '{"content":":octagonal_sign: OCI grabber was cut off before it finished — almost certainly the 350-minute job cap. No instance. Start it again with max_tries at 35 or less."}' \
            "$DISCORD_WEBHOOK" >/dev/null || true
